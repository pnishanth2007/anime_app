<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ANIMESIA - Profile</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .profile-page {
            min-height: calc(100vh - 76px);
            padding: 60px 7% 80px;
        }

        .profile-header {
            max-width: 1000px;
            margin: auto;

            display: flex;
            align-items: center;
            gap: 30px;

            padding: 35px;

            border-radius: 18px;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.10);
        }

        .profile-avatar {
            width: 110px;
            height: 110px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.10);

            font-size: 50px;

            border: 2px solid rgba(255,255,255,0.15);
        }

        .profile-info h1 {
            margin: 0 0 8px;

            font-size: 34px;
        }

        .profile-info p {
            margin: 6px 0;

            color: #aaa;
        }

        .profile-badge {
            display: inline-block;

            margin-top: 10px;

            padding: 6px 12px;

            border-radius: 20px;

            background: rgba(255,255,255,0.08);

            font-size: 12px;

            letter-spacing: 1px;
        }

        .profile-stats {
            max-width: 1000px;

            margin: 30px auto;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .profile-stat {
            padding: 25px;

            text-align: center;

            border-radius: 14px;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.08);
        }

        .profile-stat strong {
            display: block;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .profile-stat span {
            color: #999;

            font-size: 13px;
        }

        .profile-section {
            max-width: 1000px;

            margin: 35px auto;
        }

        .profile-section h2 {
            margin-bottom: 18px;
        }

        .profile-card {
            padding: 25px;

            border-radius: 14px;

            background: rgba(255,255,255,0.04);

            border: 1px solid rgba(255,255,255,0.08);
        }

        .profile-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 16px 0;

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-row span {
            color: #999;
        }

        .profile-row strong {
            color: white;
        }

        .profile-actions {
            max-width: 1000px;

            margin: 35px auto;

            display: flex;

            gap: 15px;
        }

        .profile-actions button {
            padding: 13px 24px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 700;
        }

        .edit-profile-btn {
            background: white;
            color: #111;
        }

        .logout-profile-btn {
            background: rgba(255,255,255,0.08);
            color: white;

            border:
                1px solid rgba(255,255,255,0.15) !important;
        }


        @media (max-width: 700px) {

            .profile-page {
                padding: 40px 15px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .profile-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <div class="particles"></div>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">

            <a href="home.html">

                <img
                    src="logo.png"
                    alt="ANIMESIA">

            </a>

        </div>


        <nav>

            <a href="home.html">
                Home
            </a>

            <a href="home.html#anime-section">
                Anime
            </a>

            <a href="power-arena.html">
                Power Arena
            </a>

            <a href="home.html#genres">
                Genres
            </a>

            <a href="mylist.html">
                My List
            </a>

        </nav>


        <div class="profile">

            <span id="welcomeUser">
                User
            </span>

            <button
                id="logoutBtn"
                type="button">

                Logout

            </button>

        </div>

    </header>


    <!-- PROFILE -->

    <main class="profile-page">


        <section class="profile-header">

            <div class="profile-avatar">
                👤
            </div>


            <div class="profile-info">

                <p class="hero-small">
                    ANIMESIA MEMBER
                </p>

                <h1 id="profileName">
                    User
                </h1>

                <p id="profileEmail">
                    user@animesia.com
                </p>

                <span class="profile-badge">
                    PREMIUM MEMBER
                </span>

            </div>

        </section>


        <!-- STATS -->

        <section class="profile-stats">

            <div class="profile-stat">

                <strong id="myListCount">
                    0
                </strong>

                <span>
                    MY LIST
                </span>

            </div>


            <div class="profile-stat">

                <strong id="animeCount">
                    10
                </strong>

                <span>
                    ANIME AVAILABLE
                </span>

            </div>


            <div class="profile-stat">

                <strong id="powerCount">
                    20
                </strong>

                <span>
                    CHARACTERS
                </span>

            </div>


            <div class="profile-stat">

                <strong>
                    ⚔️
                </strong>

                <span>
                    POWER ARENA
                </span>

            </div>

        </section>


        <!-- ACCOUNT -->

        <section class="profile-section">

            <p class="hero-small">
                ACCOUNT
            </p>

            <h2>
                Account Information
            </h2>


            <div class="profile-card">

                <div class="profile-row">

                    <span>
                        Username
                    </span>

                    <strong id="accountUsername">
                        User
                    </strong>

                </div>


                <div class="profile-row">

                    <span>
                        Email
                    </span>

                    <strong id="accountEmail">
                        user@animesia.com
                    </strong>

                </div>


                <div class="profile-row">

                    <span>
                        Membership
                    </span>

                    <strong>
                        ANIMESIA Member
                    </strong>

                </div>


                <div class="profile-row">

                    <span>
                        Status
                    </span>

                    <strong>
                        ● Active
                    </strong>

                </div>
                <div class="profile-row">

    <span>
        Member Since
    </span>

    <strong id="memberSince">
        -
    </strong>

</div>

            </div>

        </section>


        <!-- ACTIONS -->

        <div class="profile-actions">

            <button
                class="edit-profile-btn"
                id="editProfileBtn"
                type="button">

                ✏ EDIT PROFILE

            </button>


            <button
                class="logout-profile-btn"
                id="profileLogoutBtn"
                type="button">

                🚪 LOGOUT

            </button>

        </div>


    </main>


    <script src="script.js"></script>


   <script src="script.js"></script>

<script>

    /* ================================
       LOAD REAL PROFILE DATA
    ================================= */

    const savedUser = localStorage.getItem("ANIMESIAUser");

    let user = null;

    if (savedUser) {
        try {
            user = JSON.parse(savedUser);
        } catch (error) {
            user = null;
        }
    }


    /* ================================
       DISPLAY USER DATA
    ================================= */

    if (user) {

        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const accountUsername =
            document.getElementById("accountUsername");

        const accountEmail =
            document.getElementById("accountEmail");

        const welcomeUser =
            document.getElementById("welcomeUser");


        if (profileName) {
            profileName.textContent = user.username;
        }

        if (profileEmail) {
            profileEmail.textContent = user.email;
        }

        if (accountUsername) {
            accountUsername.textContent = user.username;
        }

        if (accountEmail) {
            accountEmail.textContent = user.email;
        }

        if (welcomeUser) {
            welcomeUser.textContent = user.username;
        }


        /* MEMBER SINCE */

        const memberSince =
            document.getElementById("memberSince");

        if (memberSince && user.createdAt) {

            const date = new Date(user.createdAt);

            memberSince.textContent =
                date.toLocaleDateString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    }
                );
        }
    }


    /* ================================
       MY LIST COUNT
    ================================= */

    let myList = [];

    try {
        myList =
            JSON.parse(
                localStorage.getItem("ANIMESIAMyList")
            ) || [];
    } catch (error) {
        myList = [];
    }


    const myListCount =
        document.getElementById("myListCount");

    if (myListCount) {
        myListCount.textContent = myList.length;
    }


    /* ================================
       PROFILE LOGOUT
    ================================= */

    const profileLogoutBtn =
        document.getElementById("profileLogoutBtn");

    if (profileLogoutBtn) {

        profileLogoutBtn.addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "ANIMESIALoggedIn"
                );

                window.location.href =
                    "index.html";
            }
        );
    }


    /* ================================
       EDIT PROFILE
    ================================= */

    const editProfileBtn =
        document.getElementById("editProfileBtn");

    if (editProfileBtn) {

        editProfileBtn.addEventListener(
            "click",
            function () {

                if (!user) {
                    return;
                }

                const newName =
                    prompt(
                        "Enter your new username:",
                        user.username
                    );

                if (
                    newName &&
                    newName.trim() !== ""
                ) {

                    user.username =
                        newName.trim();

                    localStorage.setItem(
                        "ANIMESIAUser",
                        JSON.stringify(user)
                    );

                    location.reload();
                }
            }
        );
    }

</script>

</body>

</html>
