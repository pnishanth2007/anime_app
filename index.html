<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISHVERSE - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="particles"></div>

    <div class="login-container">

        <div class="login-box">

            <h1>ANIMESIA</h1>

            <h2>ENTER A NEW UNIVERSE</h2>

            <p>Sign in and continue your journey.</p>

            <form id="loginForm">

                <div class="input-box">
                    <input type="text" id="loginInput" placeholder="Email or Username" required>
                </div>

                <div class="input-box password-box">
                    <input type="password" id="password" placeholder="Password" required>
                    <span id="togglePassword">👁</span>
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">GET IN →</button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="google-btn">
                Continue with Google
            </button>

            <p class="signup">
                New here?
                <a href="register.html">Create your account</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
